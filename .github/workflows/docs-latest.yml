name: docs-publish

on:
  push:
    branches:
      - main
      # Fork preview only; remove this branch before merging upstream.
      - migration/versioned-publishing
  release:
    types:
      - published
permissions:
  contents: write
concurrency:
  group: docs-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout branch history required to update
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
      - name: Install Poetry and dependencies
        run: |
          pip install poetry
          poetry install --no-interaction
      - name: Build all documentation versions
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            export ENABLE_PDF_EXPORT=1
          fi
          SITE_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
            bash scripts/build-docs.sh
      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
